name: Offline contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: for script in scripts/*.sh tests/*.sh tests/helpers/*.sh; do bash -n "$script" || exit; done
      - run: ./tests/run-e2e.sh
